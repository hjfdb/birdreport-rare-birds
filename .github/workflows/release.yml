name: 发布

# 打 v* 的 tag 就自动为三个桌面平台构建、并额外产出 Android APK，一起发布 Release：
#   git tag v1.0.0 && git push origin v1.0.0
#
# 也能在 Actions 页面手动点「Run workflow」试跑：只构建、把产物存成 artifact，不建 Release。
#
# 为什么是两个 job 层：各平台要并行构建，但**发布只能由一个 job 干** —— 多个 job 同时
# 调 gh release create 会互相抢（幂等判断能兜住「已存在」，兜不住「两个同时看到不存在」）。
# 所以 build（桌面三平台矩阵）与 android 各自出产物，release 等它们全好了再一次性挂上去。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 默认最小权限；只有 release job 需要写权限（建 Release）
permissions:
  contents: read

# 同一个 tag 不允许并发跑两次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # 某个平台挂了不要连累其他平台：至少能看清是哪一个平台的问题
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            ext: '.exe'
          - os: macos-latest # Apple Silicon（arm64）；Intel 用下面的 macos-15-intel
            target: mac-arm64
            ext: ''
          - os: macos-15-intel # Intel（x64）
            target: mac-x64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          # 必须钉死，不能只写 '24'：产物是「复制这份 node + 注入 SEA blob」做出来的
          # （build-exe.mjs 第 4 步），所以发布出去的程序里跑的 Node 就是这个版本。
          # 要与本机构建保持一致，否则用户拿到的运行时和你测过的不是同一个。
          node-version: '24.13.0'
          cache: npm

      - name: 安装构建依赖
        run: npm ci

      - name: 决定产物名
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          # 二进制保持中文名，跟本地 `npm run build:exe` 的产物一致，双击 / 终端里看得懂。
          # macOS 上是裸的可执行文件（无扩展名），Windows 上是 .exe。
          echo "EXE_NAME=观鸟地区稀有榜-${VERSION}-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"
          # 但**发布用的文件名必须是纯 ASCII**：实测 gh 在推导 Release 附件名时会剥掉所有
          # 非 ASCII 字符（「观鸟-中文名测试.zip」会变成「-.zip」）。ASCII 名另外还有好处：
          # URL 不做百分号转义，curl / wget / 下载器都不出乱码。
          # zip **内部**的中文名不受影响，解压出来仍是「观鸟地区稀有榜-…」。
          echo "ASSET_NAME=birdreport-rare-birds-${VERSION}-${{ matrix.target }}.zip" >> "$GITHUB_ENV"
          echo "  ▸ 二进制 ：观鸟地区稀有榜-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          echo "  ▸ 发布包 ：birdreport-rare-birds-${VERSION}-${{ matrix.target }}.zip"

      - name: 构建
        # macOS 上这一步内部还会补一次 ad-hoc 签名（见 build-exe.mjs 的 stageInject）
        run: node build-exe.mjs

      - name: 打包 zip
        # 顺序很重要：**先打包、再冒烟**。冒烟验的是解压出来的那个文件，zip 得先存在
        # （第一版把这两步写反了，三个平台一起卡在「找不到 zip」）。
        # Windows 的 exe 约 86MB，压成 zip 约 33MB，下载量少 60%。
        # macOS 必须用 zip 而不是 Compress-Archive：后者不写 Unix 权限位，解压出来没有
        # 可执行位就双击没反应。
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "dist/$env:EXE_NAME"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/$env:ASSET_NAME"
          if ($IsWindows) {
            Compress-Archive -LiteralPath $bin -DestinationPath $zip -CompressionLevel Optimal -Force
          } else {
            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'dist')
            try {
              & zip -q -9 -X $env:ASSET_NAME $env:EXE_NAME
              if ($LASTEXITCODE -ne 0) { throw "zip 失败（退出码 $LASTEXITCODE）" }
            } finally { Pop-Location }
          }
          $mb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          Write-Host "已打包：$zip（$mb MB）"

      - name: 冒烟验证（解压发布包 → 起二进制 → 打 /api/health）
        # 构建成功不等于产物能用。这里**解压 zip 再跑解压出来的那个文件**，而不是直接跑
        # dist/ 下的构建产物 —— 这样连「zip 有没有把可执行位保留下来」一起验了（macOS 上
        # 这一点尤其关键：丢了可执行位用户双击就是没反应）。
        # 失败就让整个 job 失败 —— 坏包发不出去。
        shell: pwsh
        env:
          OPEN_BROWSER: '0' # 否则二进制会试着开浏览器（CI 里没有）
          HOST: '127.0.0.1'
          PORT: '8799'
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          # 解压要用各平台的原生工具：macOS 上**不能**用 Expand-Archive ——
          # PowerShell 的 Expand-Archive 不还原 Unix 可执行位，会测出一个假失败。
          if ($IsWindows) {
            Expand-Archive -LiteralPath "dist/$env:ASSET_NAME" -DestinationPath $tmp
          } else {
            & unzip -q "dist/$env:ASSET_NAME" -d $tmp
            if ($LASTEXITCODE -ne 0) { throw "unzip 失败（退出码 $LASTEXITCODE）" }
          }

          $bin = Join-Path $tmp $env:EXE_NAME
          if (-not (Test-Path -LiteralPath $bin)) { throw "解压后没找到二进制：$bin" }
          if (-not $IsWindows) { & ls -l $bin }   # 打出权限位，便于确认

          $opts = @{ FilePath = $bin; PassThru = $true }
          if ($IsWindows) { $opts.WindowStyle = 'Hidden' }  # 这个参数只有 Windows 有
          Write-Host "启动 $bin"
          $proc = Start-Process @opts
          try {
            $resp = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "二进制提前退出了（退出码 $($proc.ExitCode)）" }
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:$env:PORT/api/health" -TimeoutSec 3
                if ($r.ok) { $resp = $r; break }
              } catch { }
            }
            if ($null -eq $resp) { throw "40 秒内 /api/health 没有返回 ok" }
            Write-Host "冒烟通过：service=$($resp.service) mode=$($resp.mode)"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: 上传构建产物
        # 发布 job 靠它拿到三个平台的 zip；手动试跑时也是从这里下载
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          # 已经是 zip 了，再压一遍没意义
          compression-level: 0
          retention-days: 7

  android:
    # 桌面三个平台的产物是「复制 Node 再注入 SEA blob」，Android 这条完全走的是另一套路：
    # 内嵌 nodejs-mobile 的 libnode.so（Node 18.20.4），Node 侧源码（server/ + web/）当 assets
    # 打进 APK，首次启动解包到私有目录再跑。所以它是独立 job，只是产物汇入同一个 Release。
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          # 只用来跑 android/fetch-nodejs-mobile.mjs 和给 Gradle 传版本号，不跑 npm ci
          node-version: '24.13.0'

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # AGP 8 必须要 JDK 17；顺便让 Gradle 依赖缓存也走这套
          cache: gradle

      - name: 安装 Android SDK 组件
        # runner 自带的 SDK 里 build-tools / NDK 版本是浮动的，可能没有我们要的那一版，
        # 而 AGP 找不到指定版本会直接失败。这里**显式钉死**三件套：
        #   platforms;android-33      → compileSdk 33
        #   build-tools;33.0.2        → buildToolsVersion
        #   ndk;25.1.8937393          → ndkVersion（编译 native-lib.cpp）
        #   cmake;3.22.1              → externalNativeBuild 指定的版本
        run: |
          # ANDROID_SDK_ROOT / ANDROID_HOME 是 runner 进程的环境变量，不是 workflow 的 env，
          # 所以只能从 shell 里读（写成 ${{ env.ANDROID_SDK_ROOT }} 会解析成空串）。
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ]; then echo "找不到 Android SDK"; exit 1; fi
          echo "SDK=$SDK"
          # 写一份 local.properties：它本身是 gitignore 的，CI 里必须现场生成
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: 拉取 nodejs-mobile 运行时
        # 约 130 MB 的官方包，解出 bin/<abi>/libnode.so 与 include/node/。
        # 不进 git（解包后近 190 MB），所以每次构建都现场拉。
        # build-apk.mjs 里也有一份「缺了就自动拉」的兜底，这里单独列一步是为了
        # 让下载失败在日志里明确显示为「拉取」这一步失败，而不是混在 Gradle 输出里。
        run: node android/fetch-nodejs-mobile.mjs

      - name: 准备签名密钥
        # 没配 Secrets 也能构建成功：app/build.gradle 会退回 debug 密钥，
        # 产物依然可以安装（只是不能上架、且换签名后需要卸载重装）。
        # 配了 Secrets 就用正式密钥，签名信息不会落盘到工作区（放在 RUNNER_TEMP）。
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ -f android/keystore.properties ]; then
              echo "::notice::未配置 Secrets，将使用随仓库提交的 android/keystore.properties 签名"
            else
              echo "::notice::未配置 Secrets 且仓库里没有 keystore.properties，release APK 将用 debug 密钥签名，仅供测试分发"
            fi
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BIRD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "BIRD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BIRD_KEY_ALIAS=$KEY_ALIAS"
            echo "BIRD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "已启用正式签名密钥"

      - name: 决定版本号
        id: ver
        shell: bash
        run: |
          # APK 里的 versionName 要跟 tag 对上，否则 Releases 里的文件名（v1.0.0）和
          # 应用「关于」里显示的版本（1.0.0）会对不起来。
          # 手动试跑时没有 tag，就沿用 gradle 里的默认值。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "  ▸ versionName=${{ steps.ver.outputs.name }}"

      - name: 构建 APK
        # 刻意走 node android/build-apk.mjs 而不是直接 ./gradlew —— 让 CI 跑的就是
        # 用户本地跑的那条路径（JDK 探测、缺 sdk.dir 就补、产物改名），
        # 免得「本地能出包、CI 出不来」这种最难查的问题。
        # 脚本内部用 java 跑 gradle-wrapper.jar，不依赖 gradlew 的可执行位。
        env:
          BIRD_VERSION_NAME: ${{ steps.ver.outputs.name }}
          # versionCode 用 run number：必须单调递增，否则 Android 会拒绝覆盖安装
          BIRD_VERSION_CODE: ${{ github.run_number }}
        run: node android/build-apk.mjs

      - name: 冒烟验证（签名 + 清单 + assets）
        # 构建成功不等于包能用。这里验三件最容易静默出错的事：
        #   ① 签名          —— 未签名的包用户装上会被系统拒绝，而日志里毫无线索
        #   ② 清单与应用名  —— application-label 乱码 / 图标丢失都只在这里看得出来
        #   ③ Node 侧文件   —— assets/nodejs-project/ 少一个文件，App 启动就是白屏
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=$(ls dist/*.apk)
          echo "产物：$APK（$(du -h "$APK" | cut -f1)）"

          echo "--- 签名 ---"
          "$SDK/build-tools/33.0.2/apksigner" verify --print-certs "$APK" | head -5

          echo "--- 清单 ---"
          BADGING=$("$SDK/build-tools/33.0.2/aapt2" dump badging "$APK" | grep -E '^(package|sdkVersion|targetSdkVersion|application-label|application-icon-160|launchable-activity)')
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.birdreport.hot'" || { echo "包名不对"; exit 1; }

          echo "--- assets ---"
          # 期望清单**直接从源码树算出来**，不硬编码文件名 ——
          # 以后往 server/ 或 web/ 里加文件，这里自动跟上，不会悄悄漏掉。
          # （Gradle 的 prepareNodeProject 是整目录拷贝，所以两边必然一一对应。）
          LIST=$(unzip -l "$APK" | awk '/assets\/nodejs-project/ {print $4}')
          echo "$LIST"
          MISSING=0
          while IFS= read -r f; do
            echo "$LIST" | grep -qx "assets/nodejs-project/$f" || { echo "assets 里缺 $f"; MISSING=1; }
          done < <(find server web -type f)
          [ "$MISSING" = 0 ] || exit 1
          echo "assets 文件数：$(echo "$LIST" | wc -l)"
          echo "冒烟通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: dist/*.apk
          # APK 本身已压缩（libnode.so 压缩率很高），不再压一遍省时间
          compression-level: 0
          retention-days: 7

  release:
    needs: [build, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取回各平台的产物
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 这个 job 没有 checkout，得显式告诉 gh 是哪个仓库
          GH_REPO: ${{ github.repository }}
        run: |
          echo "待发布的附件："
          ls -la assets

          # 带连字符的 tag（如 v0.0.1-beta）按 semver 惯例视为预发布版，
          # GitHub 上会标成 Pre-release；v1.0.0 这种就是正式版。
          ARGS=(--title "$GITHUB_REF_NAME" --verify-tag --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) ARGS+=(--prerelease);; esac

          # gh release create 不是幂等的：若同名 Release 已存在（典型情况是先在网页上建好了
          # Release 或草稿、之后才推 tag），它只会报「已存在」然后整个 job 失败，产物根本传不
          # 上去 —— 线上就留下一个没有附件的空 Release。所以先探一下：
          #   已存在 → 只上传并覆盖附件，不动你已经写好的说明与预发布标记
          #   不存在 → 照旧新建（桌面三个 zip + 安卓 apk 一次挂上）
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，改为上传并覆盖附件（保留其说明与标记）"
            gh release upload "$GITHUB_REF_NAME" assets/*.zip assets/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/*.zip assets/*.apk "${ARGS[@]}"
          fi
