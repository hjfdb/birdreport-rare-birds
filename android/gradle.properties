# Gradle 构建参数
#
# 关于 JDK：AGP 8.x 必须要 JDK 17，而很多机器上 JAVA_HOME 指着 JDK 8
# （本机就是 C:\Program Files\Java\jdk1.8.0_131），直接跑 gradlew 会报一堆
# "Unsupported class file major version 61" 之类的怪错。
#
# **不要在这里写 org.gradle.java.home** —— 它是绝对路径，写进来就把 CI（Linux）和
# 别人的机器一起弄坏了：Gradle 会拿这个路径去找 JDK，找不到直接报
# "Value ... given for org.gradle.java.home Gradle property is invalid"。
# 改用这两种方式，都与机器无关：
#   ① 推荐：node android/build-apk.mjs —— 自己探测 JDK 17+ 再传 -Dorg.gradle.java.home
#   ② 手动：JAVA_HOME=/path/to/jdk17 ./gradlew :app:copyApkToDist

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 不用 AndroidX：界面只用系统自带的 Activity / WebView，省掉一堆依赖下载。
android.useAndroidX=false
android.nonTransitiveRClass=true
